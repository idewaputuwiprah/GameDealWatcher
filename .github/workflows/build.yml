name: Build & Test

on: [push, pull_request]

jobs:
  build-and-test:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-dotnet@v4.0.1
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore

      - name: Build (non-UI projects)
        run: dotnet build src/GameDealWatcher.Tests/GameDealWatcher.Tests.csproj --no-restore --configuration Release

      - name: Test
        run: dotnet test src/GameDealWatcher.Tests/GameDealWatcher.Tests.csproj --no-build --configuration Release --verbosity normal

  publish:
    runs-on: windows-2022
    needs: build-and-test

    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-dotnet@v4.0.1
        with:
          dotnet-version: 9.0.x

      - name: Install Windows App SDK workload
        run: dotnet workload install wasdk

      - name: Publish App (self-contained)
        run: dotnet publish src/GameDealWatcher.App/GameDealWatcher.App.csproj -c Release -r win-x64 --self-contained true -p:UseAppHost=true -p:GenerateAppxPackageOnBuild=false

      - name: Upload Artifact
        uses: actions/upload-artifact@v4.6.0
        with:
          name: GameDealWatcher-windows-x64
          path: src/GameDealWatcher.App/bin/Release/net9.0-windows10.0.19041/win-x64/publish/
