name: Build & Test

on: [push, pull_request]

jobs:
  build-and-test:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-dotnet@v4.0.1
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore

      - name: Build (non-UI projects)
        run: dotnet build src/GameDealWatcher.Tests/GameDealWatcher.Tests.csproj --no-restore --configuration Release

      - name: Test
        run: dotnet test src/GameDealWatcher.Tests/GameDealWatcher.Tests.csproj --no-build --configuration Release --verbosity normal

  publish:
    runs-on: windows-2022
    needs: build-and-test

    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-dotnet@v4.0.1
        with:
          dotnet-version: 9.0.x

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore
        run: dotnet restore src/GameDealWatcher.App/GameDealWatcher.App.csproj

      - name: Publish App (self-contained, MSBuild)
        run: msbuild src/GameDealWatcher.App/GameDealWatcher.App.csproj /t:Publish /p:Configuration=Release /p:RuntimeIdentifier=win-x64 /p:SelfContained=true /p:GenerateAppxPackageOnBuild=false

      - name: Fix PRI (copy app PRI to publish dir)
        run: |
          $binDir = "src/GameDealWatcher.App/bin/Release/net9.0-windows10.0.19041/win-x64"
          $publishDir = "src/GameDealWatcher.App/bin/Release/net9.0-windows10.0.19041/win-x64/publish"
          # Copy GameDealWatcher.App.pri to publish dir (with original name)
          $appPri = Join-Path $binDir "GameDealWatcher.App.pri"
          if (Test-Path $appPri) {
            Copy-Item $appPri (Join-Path $publishDir "GameDealWatcher.App.pri") -Force
            Write-Host "Copied GameDealWatcher.App.pri to publish dir"
          }
          # Also copy as resources.pri (the XAML runtime may look for this name)
          $resPri = Join-Path $publishDir "resources.pri"
          if (-not (Test-Path $resPri)) {
            Copy-Item $appPri $resPri -Force
            Write-Host "Also copied as resources.pri"
          }

      - name: Smoke Test (bin dir - test if app works from build output)
        run: |
          $exe = "src/GameDealWatcher.App/bin/Release/net9.0-windows10.0.19041/win-x64/GameDealWatcher.App.exe"
          $crashLog = "$env:LOCALAPPDATA\GameDealWatcher\Logs\crash.log"
          if (Test-Path $crashLog) { Remove-Item $crashLog }
          Write-Host "Launching from bin dir: $exe ..."
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 10
          if ($p.HasExited) {
            Write-Host "::error::Bin dir: App exited with code $($p.ExitCode)"
            if (Test-Path $crashLog) {
              Write-Host "::error::Bin crash log:"
              Get-Content $crashLog | ForEach-Object { Write-Host "::error::$_" }
            }
          } else {
            Write-Host "Bin dir: App launched successfully (PID $($p.Id)). Stopping..."
            Stop-Process -Id $p.Id -Force
          }

      - name: Diagnose PRI generation
        run: |
          $publishDir = "src/GameDealWatcher.App/bin/Release/net9.0-windows10.0.19041/win-x64/publish"
          $binDir = "src/GameDealWatcher.App/bin/Release/net9.0-windows10.0.19041/win-x64"
          $objDir = "src/GameDealWatcher.App/obj/Release/net9.0-windows10.0.19041/win-x64"
          Write-Host "=== Checking publish dir for PRI ==="
          $publishPri = Get-ChildItem $publishDir -Filter *.pri -ErrorAction SilentlyContinue
          if ($publishPri) {
            $publishPri | ForEach-Object { Write-Host "::error::PRI in publish: $($_.Name)" }
          } else {
            Write-Host "::error::No PRI in publish dir"
          }
          Write-Host "=== Checking bin dir for PRI ==="
          $binPri = Get-ChildItem $binDir -Filter *.pri -ErrorAction SilentlyContinue
          if ($binPri) {
            $binPri | ForEach-Object { Write-Host "::error::PRI in bin: $($_.Name)" }
          } else {
            Write-Host "::error::No PRI in bin dir"
          }
          Write-Host "=== Checking obj dir for PRI ==="
          $objPri = Get-ChildItem $objDir -Filter *.pri -Recurse -ErrorAction SilentlyContinue
          if ($objPri) {
            $objPri | ForEach-Object { Write-Host "::error::PRI in obj: $($_.FullName)" }
          } else {
            Write-Host "::error::No PRI in obj dir"
          }
          Write-Host "=== All files in publish dir (first 30) ==="
          Get-ChildItem $publishDir -ErrorAction SilentlyContinue | Select-Object -First 30 | ForEach-Object { Write-Host "::error::FILE: $($_.Name)" }
          $priFile = Join-Path $publishDir "resources.pri"
          if (Test-Path $priFile) {
            Write-Host "resources.pri EXISTS in publish dir"
          } else {
            Write-Host "::error::resources.pri NOT FOUND in publish dir"
          }

      - name: Smoke Test (launch exe, verify no crash)
        run: |
          $exe = "src/GameDealWatcher.App/bin/Release/net9.0-windows10.0.19041/win-x64/publish/GameDealWatcher.App.exe"
          $crashLog = "$env:LOCALAPPDATA\GameDealWatcher\Logs\crash.log"

          # Clean up any stale crash log from previous runs
          if (Test-Path $crashLog) { Remove-Item $crashLog }

          Write-Host "Launching $exe ..."
          $p = Start-Process -FilePath $exe -PassThru

          # Give the app time to initialize (load XAML, DB, DI container)
          Start-Sleep -Seconds 10

          if ($p.HasExited) {
            Write-Host "::error::App process exited prematurely with code $($p.ExitCode)"
            if (Test-Path $crashLog) {
              Write-Host "::error::Crash log contents:"
              Get-Content $crashLog | ForEach-Object { Write-Host "::error::$_" }
            }
            exit 1
          }

          Write-Host "App launched successfully (PID $($p.Id)). Stopping..."
          Stop-Process -Id $p.Id -Force
          Write-Host "Smoke test passed."

      - name: Upload Artifact
        uses: actions/upload-artifact@v4.6.0
        with:
          name: GameDealWatcher-windows-x64
          path: src/GameDealWatcher.App/bin/Release/net9.0-windows10.0.19041/win-x64/publish/
