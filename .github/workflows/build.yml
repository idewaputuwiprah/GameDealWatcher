name: Build & Test

on: [push, pull_request]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore GameDealWatcher.sln

      - name: Build
        run: dotnet build GameDealWatcher.sln --no-restore --verbosity normal

      - name: Test
        run: |
          dotnet build src/GameDealWatcher.Tests/GameDealWatcher.Tests.csproj --no-restore
          dotnet test src/GameDealWatcher.Tests/GameDealWatcher.Tests.csproj --no-build --verbosity normal
