  publish:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-dotnet@v4.0.1
        with:
          dotnet-version: 9.0.x

      - name: Restore App
        run: dotnet restore src/GameDealWatcher.App/GameDealWatcher.App.csproj -r win-x64

      - name: Build App
        run: dotnet build src/GameDealWatcher.App/GameDealWatcher.App.csproj --no-restore -c Release -r win-x64 --self-contained true -p:UseAppHost=true -p:GenerateAppxPackageOnBuild=false

      - name: Upload Artifact
        uses: actions/upload-artifact@v4.6.0
        with:
          name: GameDealWatcher-windows-x64
          path: src/GameDealWatcher.App/bin/Release/net9.0-windows10.0.19041/win-x64/
