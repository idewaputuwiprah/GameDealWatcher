name: Build & Test

on: [push, pull_request]

jobs:
  build-and-test:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-dotnet@v4.0.1
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore

      - name: Build (non-UI projects)
        run: dotnet build src/GameDealWatcher.Tests/GameDealWatcher.Tests.csproj --no-restore --configuration Release

      - name: Test
        run: dotnet test src/GameDealWatcher.Tests/GameDealWatcher.Tests.csproj --no-build --configuration Release --verbosity normal

  publish:
    runs-on: windows-2022
    needs: build-and-test

    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-dotnet@v4.0.1
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore src/GameDealWatcher.App/GameDealWatcher.App.csproj

      - name: Publish App (self-contained)
        run: dotnet publish src/GameDealWatcher.App/GameDealWatcher.App.csproj -c Release -r win-x64 --self-contained true -p:UseAppHost=true -p:GenerateAppxPackageOnBuild=false

      - name: Diagnose PRI generation
        run: |
          $publishDir = "src/GameDealWatcher.App/bin/Release/net9.0-windows10.0.19041/win-x64/publish"
          $binDir = "src/GameDealWatcher.App/bin/Release/net9.0-windows10.0.19041/win-x64"
          $objDir = "src/GameDealWatcher.App/obj/Release/net9.0-windows10.0.19041/win-x64"
          Write-Host "=== Checking publish dir for PRI ==="
          Get-ChildItem $publishDir -Filter *.pri -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_.FullName }
          Write-Host "=== Checking bin dir for PRI ==="
          Get-ChildItem $binDir -Filter *.pri -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_.FullName }
          Write-Host "=== Checking obj dir for PRI ==="
          Get-ChildItem $objDir -Filter *.pri -Recurse -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_.FullName }
          Write-Host "=== All files in publish dir ==="
          Get-ChildItem $publishDir | ForEach-Object { Write-Host $_.Name }
          $priFile = Join-Path $publishDir "resources.pri"
          if (Test-Path $priFile) {
            Write-Host "resources.pri EXISTS in publish dir"
          } else {
            Write-Host "::error::resources.pri NOT FOUND in publish dir"
          }

      - name: Smoke Test (launch exe, verify no crash)
        run: |
          $exe = "src/GameDealWatcher.App/bin/Release/net9.0-windows10.0.19041/win-x64/publish/GameDealWatcher.App.exe"
          $crashLog = "$env:LOCALAPPDATA\GameDealWatcher\Logs\crash.log"

          # Clean up any stale crash log from previous runs
          if (Test-Path $crashLog) { Remove-Item $crashLog }

          Write-Host "Launching $exe ..."
          $p = Start-Process -FilePath $exe -PassThru

          # Give the app time to initialize (load XAML, DB, DI container)
          Start-Sleep -Seconds 10

          if ($p.HasExited) {
            Write-Host "::error::App process exited prematurely with code $($p.ExitCode)"
            if (Test-Path $crashLog) {
              Write-Host "::error::Crash log contents:"
              Get-Content $crashLog | ForEach-Object { Write-Host "::error::$_" }
            }
            exit 1
          }

          Write-Host "App launched successfully (PID $($p.Id)). Stopping..."
          Stop-Process -Id $p.Id -Force
          Write-Host "Smoke test passed."

      - name: Upload Artifact
        uses: actions/upload-artifact@v4.6.0
        with:
          name: GameDealWatcher-windows-x64
          path: src/GameDealWatcher.App/bin/Release/net9.0-windows10.0.19041/win-x64/publish/
