name: Build & Test

on: [push, pull_request]

jobs:
  build-and-test:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-dotnet@v4.0.1
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore

      - name: Build (non-UI projects)
        run: dotnet build src/GameDealWatcher.Tests/GameDealWatcher.Tests.csproj --no-restore --configuration Release

      - name: Test
        run: dotnet test src/GameDealWatcher.Tests/GameDealWatcher.Tests.csproj --no-build --configuration Release --verbosity normal

  publish:
    runs-on: windows-2022
    needs: build-and-test

    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-dotnet@v4.0.1
        with:
          dotnet-version: 9.0.x

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore
        run: dotnet restore src/GameDealWatcher.App/GameDealWatcher.App.csproj

      - name: Publish App (self-contained, MSBuild)
        run: msbuild src/GameDealWatcher.App/GameDealWatcher.App.csproj /t:Publish /p:Configuration=Release /p:RuntimeIdentifier=win-x64 /p:SelfContained=true /p:GenerateAppxPackageOnBuild=false

      - name: Fix PRI (copy app PRI to publish dir)
        run: |
          $binDir = "src/GameDealWatcher.App/bin/Release/net9.0-windows10.0.19041/win-x64"
          $publishDir = "$binDir/publish"
          $objDir = "src/GameDealWatcher.App/obj/Release/net9.0-windows10.0.19041/win-x64"

          # PRIs owned by the Windows App SDK - never treat these as the app PRI
          $sdkPris = @('Microsoft.UI.pri','Microsoft.UI.Xaml.Controls.pri','Microsoft.Windows.Workloads.pri','Microsoft.WindowsAppRuntime.pri')

          # Known WindowsAppSDK issue: msbuild /t:Publish does not copy the app PRI into
          # the publish folder. Locate it in bin or obj - depending on SDK version it may
          # be named GameDealWatcher.App.pri or resources.pri.
          $candidates = @()
          foreach ($d in @($binDir, $objDir)) {
            if (Test-Path $d) {
              $candidates += Get-ChildItem $d -Filter *.pri -File -ErrorAction SilentlyContinue |
                Where-Object { $sdkPris -notcontains $_.Name }
            }
          }
          if (-not $candidates) {
            $candidates = Get-ChildItem $objDir -Filter *.pri -File -Recurse -ErrorAction SilentlyContinue |
              Where-Object { $sdkPris -notcontains $_.Name }
          }

          if (-not $candidates) {
            Write-Host "::error::App PRI not found in bin or obj - the app will crash at startup (0xC000027B). PRI inventory:"
            if (Test-Path $binDir) { Get-ChildItem $binDir -Filter *.pri | ForEach-Object { Write-Host "::error::  bin: $($_.Name)" } }
            if (Test-Path $objDir) { Get-ChildItem $objDir -Filter *.pri -Recurse | ForEach-Object { Write-Host "::error::  obj: $($_.FullName)" } }
            exit 1
          }

          $appPri = @($candidates)[0].FullName
          Write-Host "App PRI found: $appPri"

          # MRT Core resolves unpackaged app resources via <exe-name>.pri or resources.pri;
          # provide both names so either lookup succeeds.
          Copy-Item $appPri (Join-Path $publishDir 'GameDealWatcher.App.pri') -Force
          Copy-Item $appPri (Join-Path $publishDir 'resources.pri') -Force
          Write-Host "Copied app PRI to publish dir as GameDealWatcher.App.pri and resources.pri"

      - name: Smoke Test (bin dir - test if app works from build output)
        run: |
          $exe = "src/GameDealWatcher.App/bin/Release/net9.0-windows10.0.19041/win-x64/GameDealWatcher.App.exe"
          $crashLog = "$env:LOCALAPPDATA\GameDealWatcher\Logs\crash.log"
          if (Test-Path $crashLog) { Remove-Item $crashLog }
          Write-Host "Launching from bin dir: $exe ..."
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 10
          if ($p.HasExited) {
            Write-Host "::error::Bin dir: App exited with code $($p.ExitCode)"
            if (Test-Path $crashLog) {
              Write-Host "::error::Bin crash log:"
              Get-Content $crashLog | ForEach-Object { Write-Host "::error::$_" }
            }
          } else {
            Write-Host "Bin dir: App launched successfully (PID $($p.Id)). Stopping..."
            Stop-Process -Id $p.Id -Force
          }

      - name: Smoke Test (launch exe, verify no crash)
        run: |
          $exe = "src/GameDealWatcher.App/bin/Release/net9.0-windows10.0.19041/win-x64/publish/GameDealWatcher.App.exe"
          $crashLog = "$env:LOCALAPPDATA\GameDealWatcher\Logs\crash.log"

          # Clean up any stale crash log from previous runs
          if (Test-Path $crashLog) { Remove-Item $crashLog }

          Write-Host "Launching $exe ..."
          $p = Start-Process -FilePath $exe -PassThru

          # Give the app time to initialize (load XAML, DB, DI container)
          Start-Sleep -Seconds 10

          if ($p.HasExited) {
            Write-Host "::error::App process exited prematurely with code $($p.ExitCode) (hex: 0x$('{0:X8}' -f ($p.ExitCode -band 0xFFFFFFFF)))"
            if (Test-Path $crashLog) {
              Write-Host "::error::Crash log contents:"
              Get-Content $crashLog | ForEach-Object { Write-Host "::error::$_" }
            } else {
              Write-Host "::error::No crash.log written - failure happened before OnLaunched (likely XAML/resource loading, e.g. missing app PRI)."
            }
            # Surface the actual exception from the Windows Application event log
            try {
              Get-WinEvent -FilterHashtable @{ LogName = 'Application'; StartTime = (Get-Date).AddMinutes(-5) } -ErrorAction SilentlyContinue |
                Where-Object { $_.Message -like '*GameDealWatcher*' } |
                Select-Object -First 5 |
                ForEach-Object { Write-Host "::error::EventLog: $($_.Message)" }
            } catch { }
            exit 1
          }

          Write-Host "App launched successfully (PID $($p.Id)). Stopping..."
          Stop-Process -Id $p.Id -Force
          Write-Host "Smoke test passed."

      - name: Upload Artifact
        uses: actions/upload-artifact@v4.6.0
        with:
          name: GameDealWatcher-windows-x64
          path: src/GameDealWatcher.App/bin/Release/net9.0-windows10.0.19041/win-x64/publish/
